# Mỗi kính là một khối "- name:". Thứ tự ở đây = thứ tự hiện trên trang Research.
# name:       tên đầy đủ (dòng đậm)
# short:      tên viết tắt, hiện trong ngoặc sau tên. Để "" nếu không cần.
# instrument: thiết bị / chế độ quan sát, hiện ở dòng dưới (nhạt hơn).
# image:      file trong images/facilities/. Để "" thì thẻ hiện chữ thay ảnh.
# credit:     nguồn ảnh. Để "" thì không hiện dòng "Image:".

