- title: "Telescope: When the Naked Eyes Were Not Enough"
  date: 2022-06-01
  date_text: "Jun 2022"
  venue: "USAC Astronomy Club, University of Science, VNUHCM"
  role: "Joint talk"
  image: "usac-telescope-2022-talk.jpg"
  poster: "usac-telescope-2022-poster.jpg"
  summary: "From naked-eye stargazing to the next generation of giant observatories: how the telescope opened new horizons for astronomy."
  abstract: |
    Often called a third eye on the universe, the telescope is one of the most revolutionary inventions in astronomy. It opened new horizons and revealed things beyond imagination that the naked human eye could never see.

    This seminar took the audience on a long journey: from the earliest days, when people gazed at the mysterious night sky with their own eyes, to the first crude lenses, and on to the modern instruments that have contributed so much to humanity. Finally, we looked ahead at where telescopes are heading and the ambitious plans to build ever more powerful ones.
  link: ""

- title: "Solar Eclipse Observation: USAC × Luong The Vinh High School"
  date: 2020-06-21
  time: "12:30 (GMT+7)"
  venue: "Luong The Vinh High School for the Gifted, Bien Hoa, Dong Nai"
  role: "Organizer"
  image: "eclipse-2020-photo.jpg"
  poster: "eclipse-2020-poster.jpg"
  summary: "A public partial solar eclipse observation for students in Dong Nai, part of Vietnam's first nationwide joint eclipse event since 2014."
  abstract: |
    On 21 June 2020, a partial solar eclipse was visible across Vietnam. For the first time since 2014, the country's major astronomy organisations joined forces for a coordinated nationwide observation, with each group observing from its own site and livestreaming to the public: Quy Nhon Observatory, Nha Trang Observatory (Vietnam National Space Center), the University of Science and Technology of Hanoi (USTH), the Da Nang Astronomy Club (DAC), the Ho Chi Minh City Amateur Astronomy Club (HAAC), and the USAC astronomy club.

    USAC hosted its site at Luong The Vinh High School for the Gifted in Bien Hoa, Dong Nai. Over two days, we ran astronomy exhibition booths and hands-on activities, and guided students and the public in observing the eclipse safely through protective viewers.
  partners: "VNSC · Quy Nhon Observatory · Nha Trang Observatory · USTH · DAC · HAAC"
  link: ""