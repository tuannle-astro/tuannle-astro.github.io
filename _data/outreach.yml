- title: "Measuring Supermassive Black Hole Masses: Dynamical Studies from the Galaxy Dynamics Lab"
  date: 2026-09-11
  time: "8:30–11:30 (GMT+7)"
  venue: "Seminar “Topics in Cosmology”, Room E404, University of Science, VNUHCM"
  role: "Speaker"
  image: "seminar-cosmology-2026-talk.jpeg"
  poster: "seminar-cosmology-2026-poster.jpeg"
  speakers:
    - name: "Dr. Nguyễn Trọng Hiền"
      affil: "Former lecturer, Caltech; scientist, NASA Jet Propulsion Laboratory (JPL), USA"
    - name: "Lê Nguyên Tuân"
      affil: "M.Sc. student, Faculty of Physics & Engineering Physics, University of Science, VNUHCM"
  summary: "How stellar and gas dynamical models applied to JWST, HST, ALMA and Keck data measure supermassive black hole masses."
  abstract: |
    **Full title:** Measuring Supermassive Black Hole Masses and the Galaxy Co-evolution Picture: Dynamical Studies from the Galaxy Dynamics Lab.

    I introduced research at the Galaxy Dynamics Lab (University of Michigan), focusing on how stellar and gas dynamical models are applied to high-resolution data from JWST, HST, ALMA and Keck to measure supermassive black hole masses, and what these measurements tell us about how black holes and their host galaxies evolve together.

    The seminar also featured a talk by Dr. Nguyễn Trọng Hiền on relativity and observational cosmology, followed by an open discussion with students about research directions.
  partners: "Faculty of Physics & Engineering Physics, University of Science, VNUHCM"
  link: ""

